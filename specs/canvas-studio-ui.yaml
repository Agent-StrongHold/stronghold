# Spec 1190: Canvas Studio UI — React layer editor for Da Vinci + Fabulist
#
# Companion backend: canvas-studio.yaml (spec 1189).
# This is the 7th surface in the Phosphor/Noir operator console.
#
# The Studio surface is not Turing-specific — it backs any agent that uses
# the canvas tool (Da Vinci, Fabulist, any future visual agent). It is
# accessible at /dashboard/studio and follows the same Phosphor/Noir
# design tokens as surfaces 1–6.
#
# Rendering engine: Konva.js (React-Konva) for the canvas viewport.
# Drag-to-reorder in the layer panel: @dnd-kit/sortable.
# No new CSS framework — existing Phosphor/Noir tokens only.

issue_number: 1190
title: "Canvas Studio UI — seventh console surface, React layer editor with AI generation"
status: active
complexity: XL

protocols_touched:
  - (frontend only — calls canvas API from spec 1189)

